version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostelerp_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://hostelerp:hostelerp_pass_2026@postgres:5432/hostelerp_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=hostelerp_enterprise_jwt_secret_key_2026_production
      - VERIFACTU_SOFTWARE_LICENSE=AEAT-CERT-HOSTELERP-2026-ESP
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: hostelerp_postgres
    restart: always
    environment:
      POSTGRES_DB: hostelerp_db
      POSTGRES_USER: hostelerp
      POSTGRES_PASSWORD: hostelerp_pass_2026
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostelerp -d hostelerp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hostelerp_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
